; PlatformIO Project Configuration File
; ESP32 Cheap Yellow Display (CYD) - 2 USB Type C Variant (ESP32-2432S028)
; Reference: https://github.com/witnessmenow/ESP32-Cheap-Yellow-Display

[platformio]
default_envs = cyd2usb

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
board_build.partitions = partitions_cyd_ota.csv
board_build.filesystem = littlefs

; Common settings for CYD boards
[common_cyd]
lib_deps = 
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags = 
    -DUSER_SETUP_LOADED=1
    -DCORE_DEBUG_LEVEL=0
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_BACKLIGHT_OFF=LOW
    -DXPT2046_IRQ=36
    -DXPT2046_MOSI=32
    -DXPT2046_MISO=39
    -DXPT2046_CLK=25
    -DXPT2046_CS=33
    -DCYD_LED_RED=4
    -DCYD_LED_GREEN=16
    -DCYD_LED_BLUE=17
    -DCYD_LDR=34
    -DCYD_SPEAKER=26
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DLUAI_MAXCCALLS=100

; 2 USB Type C hardware variant (ESP32-2432S028 with dual USB / Type-C)
; Uses ST7789 display controller with BGR color order as defined in
; DisplayConfig/CYD2USB/User_Setup.h of https://github.com/witnessmenow/ESP32-Cheap-Yellow-Display
[env:cyd2usb]
lib_deps = ${common_cyd.lib_deps}
build_flags = 
    ${common_cyd.build_flags}
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1

; Alternative 2 USB Type C environment using ILI9341 driver with color inversion
[env:cyd2usb_ili9341]
lib_deps = ${common_cyd.lib_deps}
build_flags = 
    ${common_cyd.build_flags}
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_INVERSION_ON=1

; Standard 1 USB (Micro-USB) CYD variant (for reference and backward compatibility)
[env:cyd]
lib_deps = ${common_cyd.lib_deps}
build_flags = 
    ${common_cyd.build_flags}
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_INVERSION_OFF=1
